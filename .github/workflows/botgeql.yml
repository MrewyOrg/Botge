name: BotgeQL

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:
    inputs:
      qualify-activity-image-in-release:
        description: The release workflow will build and smoke-test the exact Activity candidate.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check-pr-target:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/check-pr-target.yml
    permissions: {}

  changes:
    name: Detect changes
    needs: check-pr-target
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      go: ${{ steps.paths.outputs.go }}
      static: ${{ steps.paths.outputs.static }}
      activity: ${{ steps.paths.outputs.activity }}
      markup: ${{ steps.paths.outputs.markup }}
      tooling: ${{ steps.paths.outputs.tooling }}
      shell: ${{ steps.paths.outputs.shell }}
      workflows: ${{ steps.paths.outputs.workflows }}
      python: ${{ steps.paths.outputs.python }}
      ios: ${{ steps.paths.outputs.ios }}
      quantum-proofs: ${{ steps.paths.outputs.quantum-proofs }}
      qsharp: ${{ steps.paths.outputs.qsharp }}
      chemistry-proofs: ${{ steps.paths.outputs.chemistry-proofs }}
      chemistry: ${{ steps.paths.outputs.chemistry }}
      latex: ${{ steps.paths.outputs.latex }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # PR filtering compares the complete PR, including deleted and renamed files.
      # Editing this workflow validates every stage it controls.
      - name: Classify changed inputs
        uses: dorny/paths-filter@v4.0.3
        id: paths
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            python:
              - '.agents/**/*.py'
              - 'scripts/**/*.py'
              - 'quantum/proofs/symbolic/**/*.py'
              - 'chemistry/proofs/symbolic/**/*.py'
              - 'tests/python/**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/botgeql.yml'
            go:
              - 'activity/server/**'
              - 'activity/src/**'
              - 'activity/public/**'
              - 'activity/index.html'
              - 'activity/tsconfig*.json'
              - 'activity/scripts/stage-server-site.ts'
              - 'activity/**/vite.config.*'
              - 'vite.config.*'
              - 'activity/package{,-lock}.json'
              - 'package{,-lock}.json'
              - 'assets/**'
              - '**/.npmrc'
              - '.nvmrc'
              - '.husky/install.sh'
              - 'LICENSE.txt'
              - 'tsconfig.base.json'
              - 'scripts/activity/stage-activity-server.sh'
              - 'scripts/activity/check-activity-server.sh'
              - '.github/codeql/codeql-config.yml'
              - '.github/workflows/botgeql.yml'
              - '.github/workflows/codeql.yml'
              - '.github/workflows/actions.lock'
            rust:
              - '**/*.rs'
              - 'Cargo.{toml,lock}'
              - 'crates/**/Cargo.toml'
              - 'quantum/proofs/certificate/Cargo.toml'
              - 'clippy.toml'
              - 'rust*.toml'
              - '.cargo/**'
              - 'botge*.config.{json,jsonc}'
              - 'botge.config.schema.json'
              - '.env.example'
              - 'Dockerfile*'
              - 'LICENSE.txt'
              - 'scripts/rust/**'
              - '.github/workflows/botgeql.yml'
              - '.github/actions/rust-setup/**'
            static:
              - '**/*.ts'
              - '**/*.html'
              - '**/*.scss'
              - '**/tsconfig*.json'
              - '**/tsdoc.json'
              - '**/package{,-lock}.json'
              - '**/.npmrc'
              - '.nvmrc'
              - 'knip.jsonc'
              - '.github/workflows/botgeql.yml'
            activity:
              - 'activity/**/*.{ts,html,scss,css,json,jsonc}'
              - 'activity/public/**'
              - 'assets/**'
              - 'package{,-lock}.json'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - '**/.npmrc'
              - '.nvmrc'
              - '.github/workflows/botgeql.yml'
            # Build inputs match .husky/pre-commit; HTML rules and this workflow also trigger CI.
            markup:
              - 'activity/src/**'
              - 'activity/index.html'
              - 'activity/public/**'
              - 'activity/vite.config.*'
              - 'vite.config.*'
              - 'activity/package{,-lock}.json'
              - 'activity/tsconfig*.json'
              - 'activity/.env*'
              - '.env*'
              - 'activity/.htmlvalidate*'
              - '.htmlvalidate*'
              - 'tsconfig*.json'
              - 'assets/**'
              - 'package{,-lock}.json'
              - '**/.npmrc'
              - '.nvmrc'
              - '.github/workflows/botgeql.yml'
            tooling:
              - 'tests/tooling/**/*.{ts,json}'
              - 'tests/control/**/*.{ts,json}'
              - 'botge_control/**/*.{sh,service,socket}'
              - 'scripts/**/*.{sh,ts}'
              - '*.ts'
              - 'tsconfig*.json'
              - 'package{,-lock}.json'
              - '**/.npmrc'
              - '.nvmrc'
              - '.husky/**'
              - '.github/workflows/botgeql.yml'
            shell:
              - '**/*.sh'
              - '.agents/scripts/**/*.sh'
              - '.husky/{pre-commit,commit-msg,post-merge}'
              - '.shellcheckrc'
              - 'scripts/**/*.jq'
              - 'scripts/quality/run_shell_tests.py'
              - 'tests/shell/**'
              - 'compose.yaml'
              - 'botge.example.config.jsonc'
              - '.env.example'
              - 'nginx/botge-nginx.conf'
              - 'botge_control/systemd/**'
              - '.github/workflows/botgeql.yml'
            ios:
              - 'ios/**'
              - '!ios/AGENTS.md'
              - 'docs/{TERMS,PRIVACY}.md'
              - 'LICENSE.txt'
              - 'scripts/ios/{check,setup}-ios*.sh'
              - 'scripts/ios/lint-swift.sh'
              - 'scripts/ios/coverage.jq'
              - 'scripts/ios/check_swift_docs.py'
              - '.github/workflows/botgeql.yml'
            # Mathlib, the QDK and TeX Live are large; only quantum inputs install them.
            quantum-proofs:
              - 'quantum/proofs/**'
              - 'quantum/docs/**'
              - 'crates/botge-quantum/**'
              - 'crates/botge-domain/**'
              - 'crates/botge-test-support/**'
              - 'scripts/quantum/{check_proofs,verify_tex_constants}.py'
              - '.github/actions/rust-setup/**'
              - '.cargo/**'
              - 'clippy.toml'
              - 'rust*.toml'
              - 'Cargo.{toml,lock}'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/botgeql.yml'
            qsharp:
              - 'quantum/*.py'
              - 'quantum/tests/**'
              - 'quantum/src/**'
              - 'quantum/qsharp.json'
              - 'quantum/docs/botge-quantum.tex'
              - 'scripts/quantum/check_qsharp.py'
              - 'scripts/quantum/lint-qsharp.ts'
              - '.husky/install.sh'
              - 'package{,-lock}.json'
              - '**/.npmrc'
              - '.nvmrc'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/botgeql.yml'
            chemistry-proofs:
              - 'chemistry/proofs/**'
              - 'chemistry/docs/**'
              - 'chemistry/*.py'
              - 'crates/botge-chemistry/**'
              - 'crates/botge-domain/**'
              - 'crates/botge-test-support/**'
              - 'scripts/chemistry/{check_chemistry_proofs,verify_chemistry_tex}.py'
              - '.github/actions/rust-setup/**'
              - '.cargo/**'
              - 'clippy.toml'
              - 'rust*.toml'
              - 'Cargo.{toml,lock}'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/botgeql.yml'
            chemistry:
              - 'chemistry/*.py'
              - 'chemistry/tests/**'
              - 'chemistry/proofs/certificate/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/botgeql.yml'
            latex:
              - 'quantum/docs/**'
              - 'chemistry/docs/**'
              - '.chktexrc'
              - 'scripts/quality/check-latex.sh'
              - '.github/workflows/botgeql.yml'
            workflows:
              - '.github/workflows/*.{yml,yaml}'
              - '.github/workflows/actions.lock'
              - '.github/actions/**'
              - '.github/actionlint.*'
              - 'scripts/quality/lint_workflows.py'

  reuse:
    needs: changes
    uses: $/.github/workflows/reuse-validation.yml
    permissions:
      actions: read
      contents: read
    with:
      common-paths: '^\.github/workflows/botgeql\.yml$'
      checks: |
        {
          "paths": {
            "all": ".",
            "ios": "^(ios/(?!AGENTS[.]md$)|scripts/ios/|LICENSE[.]txt$|docs/(TERMS|PRIVACY)[.]md$)",
            "rust": "^(crates/|scripts/rust/|[.]cargo/|[.]github/actions/rust-setup/|Cargo[.](toml|lock)$|quantum/proofs/certificate/Cargo[.]toml$|clippy[.]toml$|rust[^/]*[.]toml$|botge[^/]*config|[.]env[.]example$|Dockerfile|LICENSE[.]txt$)|[.]rs$",
            "go": "^(activity/|assets/|scripts/activity/|[.]husky/install[.]sh$|[.]github/codeql/|[.]github/workflows/codeql[.]yml$|LICENSE[.]txt$)|(^|/)([.]npmrc|[.]nvmrc|[.]env[^/]*|package(-lock)?[.]json|tsconfig[^/]*[.]json|vite[.]config[.][^/]*)$",
            "typescript": "^(activity/|assets/|scripts/|tests/|botge_control/|[.]husky/|[.]vscode/|[.]devcontainer/|[.]htmlvalidate|knip[.]jsonc$|compose[^/]*|botge[^/]*config|Dockerfile|[.]github/)|[.](ts|tsx|html|scss|css)$|(^|/)([.]npmrc|[.]nvmrc|[.]env[^/]*|package(-lock)?[.]json|tsconfig[^/]*[.]json|tsdoc[.]json)$",
            "quantum-proofs": "^(quantum/(proofs|docs)/|crates/(botge-quantum|botge-domain|botge-test-support)/|scripts/quantum/(check_proofs|verify_tex_constants)[.]py$|[.]github/actions/rust-setup/|[.]cargo/|clippy[.]toml$|rust[^/]*[.]toml$|Cargo[.](toml|lock)$|pyproject[.]toml$|uv[.]lock$|[.]python-version$)",
            "qsharp": "^(quantum/([^/]+[.]py$|tests/|src/|qsharp[.]json$|docs/botge-quantum[.]tex$)|scripts/quantum/(check_qsharp[.]py|lint-qsharp[.]ts)$|[.]husky/install[.]sh$|package(-lock)?[.]json$|[.]nvmrc$|pyproject[.]toml$|uv[.]lock$|[.]python-version$)|(^|/)[.]npmrc$",
            "chemistry-proofs": "^(chemistry/(proofs/|docs/|[^/]+[.]py$)|crates/(botge-chemistry|botge-domain|botge-test-support)/|scripts/chemistry/(check_chemistry_proofs|verify_chemistry_tex)[.]py$|[.]github/actions/rust-setup/|[.]cargo/|clippy[.]toml$|rust[^/]*[.]toml$|Cargo[.](toml|lock)$|pyproject[.]toml$|uv[.]lock$|[.]python-version$)",
            "chemistry": "^(chemistry/([^/]+[.]py$|tests/|proofs/certificate/)|pyproject[.]toml$|uv[.]lock$|[.]python-version$)",
            "latex": "^((quantum|chemistry)/docs/|[.]chktexrc$|scripts/quality/check-latex[.]sh$)",
            "tooling": "^(scripts/|tests/|botge_control/|ios/|activity/|crates/|[.]github/|[.]agents/|[.]husky/|[.]shellcheckrc$|[.]python-version$|pyproject[.]toml$|uv[.]lock$|compose[^/]*|botge[.]example[.]config[.]jsonc$|[.]env[.]example$|nginx/botge-nginx[.]conf$|Dockerfile|Cargo[.](toml|lock)$)|[.](sh|bash|bats|jq|py|swift)$"
          },
          "checks": [
            {"id":"formatting","inputs":"all","job":"Documentation and TypeScript","step":"Check formatting and documentation"},
            {"id":"ts-static","inputs":"typescript","job":"Documentation and TypeScript","step":"Types, lint, and unused code"},
            {"id":"markup","inputs":"typescript","job":"Documentation and TypeScript","step":"Validate Activity HTML and SCSS"},
            {"id":"ts-coverage","inputs":"typescript","job":"Documentation and TypeScript","step":"Test TypeScript and enforce coverage"},
            {"id":"rust-static","inputs":"rust","job":"Rust static checks","step":"Check production build on stable Rust"},
            {"id":"rust-coverage","inputs":"rust","job":"Rust tests and coverage","step":"Check Rust tests and coverage"},
            {"id":"rust-miri","inputs":"rust","job":"Rust Miri","step":"Interpret pure Rust tests with Miri"},
            {"id":"rust-dependencies","inputs":"rust","job":"Rust features and dependencies","step":"Check Rust feature combinations and unused dependencies"},
            {"id":"go","inputs":"go","job":"Go Activity server","step":"Check the origin and enforce per-file statement coverage"},
            {"id":"ios","inputs":"ios","job":"iOS lint, tests and coverage","step":"Analyze, test and enforce coverage from one instrumented build"},
            {"id":"quantum-proofs","inputs":"quantum-proofs","job":"Quantum proofs","step":"Check Lean, symbolic, certificate and traceability proofs"},
            {"id":"qsharp","inputs":"qsharp","job":"Q# circuit and sidecar","step":"Test the sidecar and circuit and enforce coverage"},
            {"id":"chemistry-proofs","inputs":"chemistry-proofs","job":"Chemistry proofs","step":"Check Lean, symbolic, certificate, Rust and traceability proofs"},
            {"id":"chemistry","inputs":"chemistry","job":"Chemistry sidecar","step":"Test the chemistry sidecar and enforce coverage"},
            {"id":"latex","inputs":"latex","job":"LaTeX specification","step":"Lint and build the specification"},
            {"id":"tooling","inputs":"tooling","job":"Shell, Python, and workflow checks","step":"Record completed tooling checks"}
          ]
        }

  documentation-and-typescript:
    name: Documentation and TypeScript
    needs: [check-pr-target, changes, reuse]
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require successful change detection
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_DETECTION_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check formatting and documentation
        if: ${{ !contains(needs.reuse.outputs.checks, ',formatting,') }}
        run: |
          npx prettier . --check
          npm run markdownlint

      - name: Check PR title and commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Dependabot titles can name full commit hashes; merge commits never reuse PR titles.
          if [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
            printf '%s\n' "$PR_TITLE" | npx commitlint
          fi
          npx commitlint --from="$BASE_SHA" --to="$HEAD_SHA" --verbose

      - name: Types, lint, and unused code
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',ts-static,') && (needs.changes.outputs.static
          == 'true') }}
        run: npm run check:static

      - name: Validate Activity HTML and SCSS
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',markup,') && (needs.changes.outputs.markup ==
          'true') }}
        env:
          VITE_ENABLE_7TV_DISCOVERY: 'true'
          VITE_ENABLE_ACTIVITY_ADDS: 'true'
          VITE_ENABLE_ACTIVITY_CATALOG: 'true'
          VITE_ENABLE_ACTIVITY_GAME: 'true'
          VITE_ENABLE_ACTIVITY_SETTINGS: 'true'
        run: npm run check:markup -w activity

      - name: Test TypeScript and enforce coverage
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',ts-coverage,') &&
          (needs.changes.outputs.tooling == 'true' || needs.changes.outputs.activity == 'true') }}
        run: npm run test:coverage

  # The Rust scopes run in parallel. Each job keeps its own build cache through the shared setup.
  rust-static:
    name: Rust static checks
    needs: [changes, reuse]
    if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      OPUS_BUNDLED: '1'
    steps:
      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',rust-static,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Checkout repository
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-static,') }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-static,') }}
        uses: $/.github/actions/rust-setup
        with:
          cache-name: static
          cache-paths: |
            target/debug
            target/stable
          components: clippy,rustfmt

      - name: Check Rust formatting, lints, and documentation
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-static,') }}
        run: sh scripts/rust/check-rust.sh static

      # The production image builds with this stable release; keep nightly-only code out of it.
      - name: Check production build on stable Rust
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-static,') }}
        run: |
          toolchain=$(sed -n "s/^rust-version = '\(.*\)'$/\1/p" Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --no-self-update --profile minimal
          cargo "+$toolchain" check --workspace --locked --target-dir target/stable

  rust-coverage:
    name: Rust tests and coverage
    needs: [changes, reuse]
    if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      OPUS_BUNDLED: '1'
    steps:
      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',rust-coverage,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Checkout repository
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-coverage,') }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-coverage,') }}
        uses: $/.github/actions/rust-setup
        with:
          cache-name: coverage
          cache-paths: target/llvm-cov-branch
          components: llvm-tools-preview
          tools: cargo-llvm-cov ffmpeg

      - name: Check Rust tests and coverage
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-coverage,') }}
        run: sh scripts/rust/check-rust.sh coverage

  rust-miri:
    name: Rust Miri
    needs: [changes, reuse]
    if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      OPUS_BUNDLED: '1'
    steps:
      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',rust-miri,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Checkout repository
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-miri,') }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-miri,') }}
        uses: $/.github/actions/rust-setup
        with:
          cache-name: miri
          cache-paths: |
            target/miri
            ~/.cache/miri
          components: miri,rust-src

      - name: Prepare Miri standard library
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-miri,') }}
        run: cargo miri setup

      - name: Interpret pure Rust tests with Miri
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-miri,') }}
        run: sh scripts/rust/check-rust.sh miri

  rust-dependencies:
    name: Rust features and dependencies
    needs: [changes, reuse]
    if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      OPUS_BUNDLED: '1'
    steps:
      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',rust-dependencies,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Checkout repository
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-dependencies,') }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-dependencies,') }}
        uses: $/.github/actions/rust-setup
        with:
          cache-name: dependencies
          cache-paths: target/debug
          tools: cargo-hack cargo-udeps

      - name: Check Rust feature combinations and unused dependencies
        if: ${{ !contains(needs.reuse.outputs.checks, ',rust-dependencies,') }}
        run: sh scripts/rust/check-rust.sh dependencies

  go-activity:
    name: Go Activity server
    needs: [changes, reuse]
    if: always() && !cancelled() && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: activity/server/.go-version
          cache-dependency-path: activity/server/tools/go.sum

      - name: Set up Node for the Activity build
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies and stage the production Activity
        run: |
          npm ci --prefer-offline --no-audit
          sh scripts/activity/stage-activity-server.sh

      - name: Install the pinned Go linter
        if: ${{ !contains(needs.reuse.outputs.checks, ',go,') }}
        run: |
          version=2.15.0
          archive="golangci-lint-${version}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/golangci/golangci-lint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' \
            9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea "$archive" |
            sha256sum -c -
          tar -xzf "$archive" "golangci-lint-${version}-linux-amd64/golangci-lint"
          printf '%s\n' "$RUNNER_TEMP/golangci-lint-${version}-linux-amd64" >> "$GITHUB_PATH"

      - name: Check the origin and enforce per-file statement coverage
        if: ${{ !contains(needs.reuse.outputs.checks, ',go,') }}
        run: sh scripts/activity/check-activity-server.sh

      - name: Check current Go advisories after reusing coverage
        if: contains(needs.reuse.outputs.checks, ',go,')
        run: sh scripts/activity/check-activity-server.sh --vulnerabilities-only

      - name: Build the production Activity origin image
        if: ${{ !inputs.qualify-activity-image-in-release }}
        run: |
          docker buildx create --name activity-origin --driver docker-container --driver-opt \
            image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
          docker buildx build --builder activity-origin --platform linux/amd64 --load \
            --policy reset=true,filename=activity/server/Dockerfile.rego,strict=true \
            --tag botge-activity-origin:ci \
            --file activity/server/Dockerfile .

      - name: Smoke-test the production Activity origin image
        if: ${{ !inputs.qualify-activity-image-in-release }}
        env:
          BOTGE_ACTIVITY_IMAGE: botge-activity-origin:ci
        working-directory: activity/server
        run: go test -mod=readonly ./cmd/activity-server -run '^TestActivityImage$' -count=1

  # Standard macOS runners are free for public repositories; see docs/PRODUCTION.md#cost-policy.
  # `xcode-27` is the standard-size preview image with Xcode 27 (`macos-latest` has only Xcode 26);
  # never use its paid larger variant.
  ios:
    name: iOS lint, tests and coverage
    needs: [changes, reuse]
    if: always() && !cancelled() && needs.changes.outputs.ios == 'true'
    runs-on: ${{ contains(needs.reuse.outputs.checks, ',ios,') && 'ubuntu-latest' || 'xcode-27' }}
    timeout-minutes: 60
    env:
      BOTGE_IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17e,OS=latest
    steps:
      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',ios,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Checkout repository
        if: ${{ !contains(needs.reuse.outputs.checks, ',ios,') }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The app targets iOS 27, so use the newest installed Xcode 27.
      - name: Select Xcode 27
        if: ${{ !contains(needs.reuse.outputs.checks, ',ios,') }}
        id: xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -n 1)
          test -n "$xcode"
          sudo xcode-select --switch "$xcode"
          version=$(xcodebuild -version)
          printf '%s\n' "$version"
          fingerprint=$(printf '%s\n' "$version" | shasum -a 256 | cut -d ' ' -f 1)
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore pinned iOS tools
        if: ${{ !contains(needs.reuse.outputs.checks, ',ios,') }}
        uses: actions/cache/restore@v6.1.0
        id: ios-tools
        with:
          path: ios/Tools/.build
          key:
            ios-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.fingerprint }}-${{
            hashFiles('ios/Tools/Package.swift', 'ios/Tools/Package.resolved',
            'scripts/ios/setup-ios-tools.sh') }}

      - name: Build pinned iOS tools
        if: ${{ !contains(needs.reuse.outputs.checks, ',ios,') }}
        env:
          BOTGE_IOS_USE_CACHED_TOOLS: ${{ steps.ios-tools.outputs.cache-hit }}
        run: sh scripts/ios/setup-ios-tools.sh

      - name: Save built iOS tools before validation
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',ios,') && steps.ios-tools.outputs.cache-hit !=
          'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ios/Tools/.build
          key: ${{ steps.ios-tools.outputs.cache-primary-key }}

      - name: Check Swift formatting and lints
        if: ${{ !contains(needs.reuse.outputs.checks, ',ios,') }}
        run: sh scripts/ios/check-ios.sh lint

      - name: Analyze, test and enforce coverage from one instrumented build
        if: ${{ !contains(needs.reuse.outputs.checks, ',ios,') }}
        run: sh scripts/ios/check-ios.sh ci

  # Proofs need Lean with Mathlib's prebuilt cache, the pinned nightly and the dev Python group.
  quantum-proofs:
    name: Quantum proofs
    needs: [changes, reuse]
    if: always() && !cancelled() && needs.changes.outputs.quantum-proofs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',quantum-proofs,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Checkout repository
        if: ${{ !contains(needs.reuse.outputs.checks, ',quantum-proofs,') }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        if: ${{ !contains(needs.reuse.outputs.checks, ',quantum-proofs,') }}
        uses: $/.github/actions/rust-setup
        with:
          cache-name: quantum-proofs
          cache-paths: |
            target/debug
            target/release
          components: clippy,rustfmt

      - name: Set up Python
        if: ${{ !contains(needs.reuse.outputs.checks, ',quantum-proofs,') }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up locked Python package manager
        if: ${{ !contains(needs.reuse.outputs.checks, ',quantum-proofs,') }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Install pinned Python tools
        if: ${{ !contains(needs.reuse.outputs.checks, ',quantum-proofs,') }}
        run: uv sync --locked --no-python-downloads

      # elan installs the toolchain named in lean-toolchain on first use.
      - name: Install the pinned Lean toolchain manager
        if: ${{ !contains(needs.reuse.outputs.checks, ',quantum-proofs,') }}
        run: |
          version=4.4.0
          archive=elan-x86_64-unknown-linux-gnu.tar.gz
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/leanprover/elan/releases/download/v${version}/${archive}"
          printf '%s  %s\n' \
            0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2 "$archive" |
            sha256sum -c -
          tar -xzf "$archive" elan-init
          ./elan-init -y --default-toolchain none --no-modify-path
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Mathlib's free cache replaces a multi-hour Mathlib build; nothing is stored in Actions.
      - name: Fetch prebuilt Mathlib
        if: ${{ !contains(needs.reuse.outputs.checks, ',quantum-proofs,') }}
        working-directory: quantum/proofs/lean
        run: lake exe cache get

      - name: Check Lean, symbolic, certificate and traceability proofs
        if: ${{ !contains(needs.reuse.outputs.checks, ',quantum-proofs,') }}
        run: .venv/bin/python scripts/quantum/check_proofs.py

  qsharp:
    name: Q# circuit and sidecar
    needs: [changes, reuse]
    if: always() && !cancelled() && needs.changes.outputs.qsharp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QDK_PYTHON_TELEMETRY: none
    steps:
      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',qsharp,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Checkout repository
        if: ${{ !contains(needs.reuse.outputs.checks, ',qsharp,') }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: ${{ !contains(needs.reuse.outputs.checks, ',qsharp,') }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Q# linter in qsharp-lang must match the Python QDK version.
      - name: Install Node dependencies
        if: ${{ !contains(needs.reuse.outputs.checks, ',qsharp,') }}
        run: npm ci --prefer-offline --no-audit

      - name: Set up Python
        if: ${{ !contains(needs.reuse.outputs.checks, ',qsharp,') }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up locked Python package manager
        if: ${{ !contains(needs.reuse.outputs.checks, ',qsharp,') }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Install the QDK and sidecar dependencies
        if: ${{ !contains(needs.reuse.outputs.checks, ',qsharp,') }}
        run: uv sync --locked --extra quantum --no-python-downloads

      - name: Lint, compile and cover the Q# circuit
        if: ${{ !contains(needs.reuse.outputs.checks, ',qsharp,') }}
        run: .venv/bin/python scripts/quantum/check_qsharp.py

      - name: Lint and type-check the sidecar
        if: ${{ !contains(needs.reuse.outputs.checks, ',qsharp,') }}
        run: |
          .venv/bin/python -m ruff check quantum/*.py quantum/tests/*.py
          .venv/bin/python -m ruff format --check quantum/*.py quantum/tests/*.py
          .venv/bin/python -m pyright quantum/*.py quantum/tests/*.py

      - name: Test the sidecar and circuit and enforce coverage
        if: ${{ !contains(needs.reuse.outputs.checks, ',qsharp,') }}
        run: |
          mkdir -p coverage/python tmp/pytest_cache
          .venv/bin/python -m coverage run --branch --data-file=coverage/python/.coverage \
            --source=quantum --omit='quantum/tests/*,quantum/proofs/*' \
            -m pytest -v -o cache_dir=tmp/pytest_cache quantum --ignore=quantum/proofs
          .venv/bin/python -m coverage report \
            --data-file=coverage/python/.coverage --show-missing
          .venv/bin/python -m coverage json \
            --data-file=coverage/python/.coverage -o coverage/python/quantum.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          files = json.loads(Path('coverage/python/quantum.json').read_text(encoding='utf-8'))['files']
          if not files:
              raise SystemExit('No quantum Python files were measured')
          failed = False
          for path, entry in sorted(files.items()):
              summary = entry['summary']
              for category, total_key in (('lines', 'num_statements'), ('branches', 'num_branches')):
                  total = summary[total_key]
                  covered = summary[f'covered_{category}']
                  if total > 0 and covered * 100 < total * 90:
                      print(f'{path} {category}: {covered}/{total} below 90%')
                      failed = True
          raise SystemExit(1 if failed else 0)
          PY

