# cspell:words GOBIN rhysd tsdoc

name: BotgeQL

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check-pr-target:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/check-pr-target.yml
    permissions: {}

  changes:
    name: Detect changes
    needs: check-pr-target
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      static: ${{ steps.paths.outputs.static }}
      activity: ${{ steps.paths.outputs.activity }}
      markup: ${{ steps.paths.outputs.markup }}
      tooling: ${{ steps.paths.outputs.tooling }}
      shell: ${{ steps.paths.outputs.shell }}
      workflows: ${{ steps.paths.outputs.workflows }}
      python: ${{ steps.paths.outputs.python }}
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # PR filtering compares the complete PR, including deleted and renamed files.
      # Editing this workflow validates every stage it controls.
      - name: Classify changed inputs
        uses: dorny/paths-filter@v4.0.3
        id: paths
        with:
          filters: |
            python:
              - '.agents/**/*.py'
              - 'scripts/**/*.py'
              - 'tests/python/**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'scripts/check_python.py'
              - '.github/workflows/botgeql.yml'
            rust:
              - '**/*.rs'
              - 'Cargo.{toml,lock}'
              - 'crates/**/Cargo.toml'
              - 'clippy.toml'
              - 'rust*.toml'
              - '.cargo/**'
              - 'botge*.config.{json,jsonc}'
              - 'botge.config.schema.json'
              - '.env.example'
              - 'Dockerfile*'
              - 'scripts/check-rust*.sh'
              - 'scripts/install-test-ffmpeg.sh'
              - '.github/workflows/botgeql.yml'
            static:
              - '**/*.ts'
              - '**/*.html'
              - '**/*.scss'
              - '**/tsconfig*.json'
              - '**/tsdoc.json'
              - '**/package{,-lock}.json'
              - '**/.npmrc'
              - '.nvmrc'
              - 'knip.jsonc'
              - '.github/workflows/botgeql.yml'
            activity:
              - 'activity/**/*.{ts,html,scss,css,json,jsonc}'
              - 'activity/public/**'
              - 'assets/**'
              - 'package{,-lock}.json'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - '**/.npmrc'
              - '.nvmrc'
              - '.github/workflows/botgeql.yml'
            # Build inputs match .husky/pre-commit; HTML rules and this workflow also trigger CI.
            markup:
              - 'activity/src/**'
              - 'activity/index.html'
              - 'activity/public/**'
              - 'activity/vite.config.*'
              - 'vite.config.*'
              - 'activity/package{,-lock}.json'
              - 'activity/tsconfig*.json'
              - 'activity/.env*'
              - '.env*'
              - 'activity/.htmlvalidate*'
              - '.htmlvalidate*'
              - 'tsconfig*.json'
              - 'assets/**'
              - 'package{,-lock}.json'
              - '**/.npmrc'
              - '.nvmrc'
              - '.github/workflows/botgeql.yml'
            tooling:
              - 'tests/tooling/**/*.{ts,json}'
              - 'tests/control/**/*.{ts,json}'
              - 'botge_control/**/*.{sh,service,socket}'
              - 'scripts/**/*.{sh,ts}'
              - '*.ts'
              - 'tsconfig*.json'
              - 'package{,-lock}.json'
              - '**/.npmrc'
              - '.nvmrc'
              - '.husky/**'
              - '.github/workflows/botgeql.yml'
            shell:
              - '**/*.sh'
              - '.agents/scripts/**/*.sh'
              - '.husky/{pre-commit,commit-msg,post-merge}'
              - '.shellcheckrc'
              - '.github/workflows/botgeql.yml'
            ios:
              - 'ios/**'
              - 'docs/{TERMS,PRIVACY}.md'
              - 'LICENSE.txt'
              - 'scripts/{check,setup}-ios*.sh'
              - 'scripts/lint-swift.sh'
              - 'scripts/check_swift_docs.py'
              - '.github/workflows/botgeql.yml'
            workflows:
              - '.github/workflows/*.{yml,yaml}'
              - '.github/actionlint.*'
              - 'scripts/lint-workflows.sh'

  documentation-and-typescript:
    name: Documentation and TypeScript
    needs: [check-pr-target, changes]
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require successful change detection
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_DETECTION_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check formatting and documentation
        run: |
          npx prettier . --check
          npm run markdownlint
          npm run cspell

      - name: Check PR title and commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Dependabot titles can name full commit hashes; merge commits never reuse PR titles.
          if [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
            printf '%s\n' "$PR_TITLE" | npx commitlint
          fi
          npx commitlint --from="$BASE_SHA" --to="$HEAD_SHA" --verbose

      - name: Types, lint, and unused code
        if: needs.changes.outputs.static == 'true'
        run: npm run check:static

      - name: Validate Activity HTML and SCSS
        if: needs.changes.outputs.markup == 'true'
        env:
          VITE_ENABLE_7TV_DISCOVERY: 'true'
          VITE_ENABLE_ACTIVITY_ADDS: 'true'
          VITE_ENABLE_ACTIVITY_CATALOG: 'true'
          VITE_ENABLE_ACTIVITY_SETTINGS: 'true'
        run: npm run check:markup -w activity

      - name: Test TypeScript and enforce coverage
        if: needs.changes.outputs.tooling == 'true' || needs.changes.outputs.activity == 'true'
        run: npm run test:coverage

  # The Rust scopes run in parallel. Each job keeps its own build cache through the shared setup.
  rust-static:
    name: Rust static checks
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      OPUS_BUNDLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-name: static
          cache-paths: |
            target/debug
            target/stable
          components: clippy,rustfmt

      - name: Check Rust formatting, lints, and documentation
        run: sh scripts/check-rust.sh static

      # The production image builds with this stable release; keep nightly-only code out of it.
      - name: Check production build on stable Rust
        run: |
          toolchain=$(sed -n "s/^rust-version = '\(.*\)'$/\1/p" Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --no-self-update --profile minimal
          cargo "+$toolchain" check --workspace --locked --target-dir target/stable

  rust-coverage:
    name: Rust tests and coverage
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      OPUS_BUNDLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-name: coverage
          cache-paths: target/llvm-cov-branch
          components: llvm-tools-preview
          tools: cargo-llvm-cov ffmpeg

      - name: Check Rust tests and coverage
        run: sh scripts/check-rust.sh coverage

  rust-miri:
    name: Rust Miri
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      OPUS_BUNDLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-name: miri
          cache-paths: |
            target/miri
            ~/.cache/miri
          components: miri,rust-src

      - name: Prepare Miri standard library
        run: cargo miri setup

      - name: Interpret pure Rust tests with Miri
        run: sh scripts/check-rust.sh miri

  rust-dependencies:
    name: Rust features and dependencies
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      OPUS_BUNDLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-name: dependencies
          cache-paths: target/debug
          tools: cargo-hack cargo-udeps

      - name: Check Rust feature combinations and unused dependencies
        run: sh scripts/check-rust.sh dependencies

  # Rulesets require this check name. It passes only when every stage succeeded or was skipped.
  # Standard macOS runners are free for public repositories; see docs/PRODUCTION.md#cost-policy.
  # `xcode-27` is the standard-size preview image with Xcode 27 (`macos-latest` has only Xcode 26);
  # never use its paid larger variant.
  ios:
    name: iOS lint, tests and coverage
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      BOTGE_IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17e,OS=latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The app targets iOS 27, so use the newest installed Xcode 27.
      - name: Select Xcode 27
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -n 1)
          test -n "$xcode"
          sudo xcode-select --switch "$xcode"
          xcodebuild -version

      - name: Restore pinned iOS tools
        uses: actions/cache@v6.1.0
        with:
          path: ios/Tools/.build
          key:
            ios-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('ios/Tools/Package.resolved') }}

      - name: Build pinned iOS tools
        run: sh scripts/setup-ios-tools.sh

      - name: Set up Python for the documentation check
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Check Swift formatting, lints and documentation tags
        run: sh scripts/check-ios.sh static

      - name: Find unused Swift declarations and imports
        run: sh scripts/check-ios.sh analyze

      - name: Run iOS tests and enforce coverage
        run: sh scripts/check-ios.sh test

  botgeql:
    name: BotgeQL
    needs:
      [
        check-pr-target,
        changes,
        documentation-and-typescript,
        rust-static,
        rust-coverage,
        rust-miri,
        rust-dependencies,
        ios
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every BotgeQL stage to pass
        env:
          RESULTS: >-
            check-pr-target=${{ needs.check-pr-target.result }} changes=${{ needs.changes.result }}
            documentation-and-typescript=${{ needs.documentation-and-typescript.result }}
            rust-static=${{ needs.rust-static.result }} rust-coverage=${{ needs.rust-coverage.result
            }} rust-miri=${{ needs.rust-miri.result }} rust-dependencies=${{
            needs.rust-dependencies.result }} ios=${{ needs.ios.result }}
        run: |
          status=0
          for entry in $RESULTS; do
            case "${entry#*=}" in
              success | skipped) ;;
              *)
                printf '%s\n' "BotgeQL stage ${entry%%=*} ended as ${entry#*=}." >&2
                status=1
                ;;
            esac
          done
          # Change detection gates the other stages, so it must have run.
          case "$RESULTS" in
            *changes=success*) ;;
            *) status=1 ;;
          esac
          exit "$status"

  tooling-lint:
    name: Shell and workflow lint
    needs: [check-pr-target, changes]
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful change detection
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_DETECTION_RESULT" = success

      - name: Checkout repository
        if: >-
          needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflows == 'true' ||
          needs.changes.outputs.python == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python tools
        if: needs.changes.outputs.python == 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up locked Python package manager
        if: needs.changes.outputs.python == 'true'
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Install pinned Python tools
        if: needs.changes.outputs.python == 'true'
        run: uv sync --locked --no-python-downloads

      - name: Check Python helpers
        if: needs.changes.outputs.python == 'true'
        run: .venv/bin/python scripts/check_python.py

      - name: Install ShellCheck
        if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflows == 'true'
        shell: bash
        run: |
          if ! command -v shellcheck > /dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=2 update --error-on=any
            sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends shellcheck
          fi

      - name: Restore actionlint
        if: needs.changes.outputs.workflows == 'true'
        uses: actions/cache@v6.1.0
        id: actionlint-cache
        with:
          path: ${{ runner.temp }}/botge-linters/actionlint
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-1.7.12

      - name: Install actionlint
        if:
          needs.changes.outputs.workflows == 'true' && steps.actionlint-cache.outputs.cache-hit !=
          'true'
        run: |
          mkdir -p "$RUNNER_TEMP/botge-linters"
          GOBIN="$RUNNER_TEMP/botge-linters" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Add actionlint to PATH
        if: needs.changes.outputs.workflows == 'true'
        run: printf '%s\n' "$RUNNER_TEMP/botge-linters" >> "$GITHUB_PATH"

      - name: Check shell scripts
        if: needs.changes.outputs.shell == 'true'
        run: bash scripts/lint-shell.sh

      - name: Check workflows and inline shell
        if: needs.changes.outputs.workflows == 'true'
        run: sh scripts/lint-workflows.sh
