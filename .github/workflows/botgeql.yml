# cspell:words botgeql demuxer GOBIN rhysd tsdoc VITE webp

name: BotgeQL

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check-pr-target:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/check-pr-target.yml
    permissions: {}

  changes:
    name: Detect changes
    needs: check-pr-target
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      static: ${{ steps.paths.outputs.static }}
      activity: ${{ steps.paths.outputs.activity }}
      markup: ${{ steps.paths.outputs.markup }}
      tooling: ${{ steps.paths.outputs.tooling }}
      shell: ${{ steps.paths.outputs.shell }}
      workflows: ${{ steps.paths.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # PR filtering compares the complete PR, including deleted and renamed files.
      # Editing this workflow validates every stage it controls.
      - name: Classify changed inputs
        uses: dorny/paths-filter@v4.0.3
        id: paths
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.{toml,lock}'
              - 'rust*.toml'
              - '.cargo/**'
              - 'botge*.config.{json,jsonc}'
              - 'botge.config.schema.json'
              - '.env.example'
              - 'Dockerfile*'
              - 'scripts/check-rust-coverage.sh'
              - 'scripts/install-test-ffmpeg.sh'
              - '.github/workflows/botgeql.yml'
            static:
              - '**/*.ts'
              - '**/tsconfig*.json'
              - '**/tsdoc.json'
              - '**/package{,-lock}.json'
              - '**/.npmrc'
              - '.nvmrc'
              - 'knip.jsonc'
              - '.github/workflows/botgeql.yml'
            activity:
              - 'activity/**/*.{ts,html,scss,css,json,jsonc}'
              - 'activity/public/**'
              - 'assets/**'
              - 'package{,-lock}.json'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - '**/.npmrc'
              - '.nvmrc'
              - '.github/workflows/botgeql.yml'
            markup:
              - 'activity/src/**/*.{ts,html,scss,css}'
              - 'activity/index.html'
              - 'activity/public/**'
              - 'activity/vite.config.*'
              - 'activity/package{,-lock}.json'
              - 'activity/tsconfig*.json'
              - 'activity/.htmlvalidate*'
              - '.htmlvalidate*'
              - 'tsconfig*.json'
              - 'assets/**'
              - 'package{,-lock}.json'
              - '**/.npmrc'
              - '.nvmrc'
              - '.github/workflows/botgeql.yml'
            tooling:
              - 'tests/tooling/**/*.{ts,json}'
              - 'tests/control/**/*.{ts,json}'
              - 'botge_control/**/*.{sh,service,socket}'
              - 'scripts/**/*.{sh,ts}'
              - '*.ts'
              - 'tsconfig*.json'
              - 'package{,-lock}.json'
              - '**/.npmrc'
              - '.nvmrc'
              - '.husky/**'
              - '.github/workflows/botgeql.yml'
            shell:
              - '**/*.sh'
              - '.husky/{pre-commit,commit-msg,post-merge}'
              - '.shellcheckrc'
              - '.github/workflows/botgeql.yml'
            workflows:
              - '.github/workflows/*.{yml,yaml}'
              - '.github/actionlint.*'
              - 'scripts/lint-workflows.sh'

  botgeql:
    name: BotgeQL
    needs: [check-pr-target, changes]
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Require successful change detection
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_DETECTION_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check formatting and documentation
        run: |
          npx prettier . --check
          npm run markdownlint
          npm run cspell

      - name: Check PR title and commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_TITLE" | npx commitlint
          npx commitlint --from="$BASE_SHA" --to="$HEAD_SHA" --verbose

      - name: Types, lint, and unused code
        if: needs.changes.outputs.static == 'true'
        run: npm run check:static

      - name: Restore Rust build cache
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/llvm-cov-branch
          key: >-
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{
            hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Restore pinned Rust test tools
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@v6.1.0
        id: rust-tools
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ${{ runner.temp }}/botge-test-bin
          key: >-
            rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml',
            'scripts/install-test-ffmpeg.sh', '.github/workflows/botgeql.yml') }}

      - name: Install Rust native dependencies
        if: needs.changes.outputs.rust == 'true'
        run: |
          if ! pkg-config --exists opus; then
            sudo apt-get -o Acquire::Retries=2 update --error-on=any
            sudo apt-get -o Acquire::Retries=2 install --yes --no-install-recommends libopus-dev pkg-config
          fi
          rustup show active-toolchain
          cargo --version

      # These tools are pinned together by the installer and workflow cache key.
      - name: Install Rust coverage and render tools
        if: needs.changes.outputs.rust == 'true' && steps.rust-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version 0.9.1 cargo-llvm-cov
          sh scripts/install-test-ffmpeg.sh "$RUNNER_TEMP/botge-test-bin"

      - name: Add render tools to PATH
        if: needs.changes.outputs.rust == 'true'
        run: printf '%s\n' "$RUNNER_TEMP/botge-test-bin" >> "$GITHUB_PATH"

      - name: Check Rust formatting, lints, and coverage
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          sh scripts/check-rust-coverage.sh

      - name: Validate Activity HTML and SCSS
        if: needs.changes.outputs.markup == 'true'
        env:
          VITE_ENABLE_7TV_DISCOVERY: 'true'
          VITE_ENABLE_ACTIVITY_ADDS: 'true'
          VITE_ENABLE_ACTIVITY_CATALOG: 'true'
          VITE_ENABLE_ACTIVITY_SETTINGS: 'true'
        run: npm run check:markup -w activity

      - name: Test repository tooling
        if: needs.changes.outputs.tooling == 'true'
        run: npm test -- --run --project Tooling

      - name: Test Activity and Worker coverage
        if: needs.changes.outputs.activity == 'true'
        run: npm run test:coverage -w activity

  tooling-lint:
    name: Shell and workflow lint
    needs: [check-pr-target, changes]
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful change detection
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_DETECTION_RESULT" = success

      - name: Checkout repository
        if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflows == 'true'
        shell: bash
        run: |
          if ! command -v shellcheck > /dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=2 update --error-on=any
            sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends shellcheck
          fi

      - name: Restore actionlint
        if: needs.changes.outputs.workflows == 'true'
        uses: actions/cache@v6.1.0
        id: actionlint-cache
        with:
          path: ${{ runner.temp }}/botge-linters/actionlint
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-1.7.12

      - name: Install actionlint
        if:
          needs.changes.outputs.workflows == 'true' && steps.actionlint-cache.outputs.cache-hit !=
          'true'
        run: |
          mkdir -p "$RUNNER_TEMP/botge-linters"
          GOBIN="$RUNNER_TEMP/botge-linters" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Add actionlint to PATH
        if: needs.changes.outputs.workflows == 'true'
        run: printf '%s\n' "$RUNNER_TEMP/botge-linters" >> "$GITHUB_PATH"

      - name: Check shell scripts
        if: needs.changes.outputs.shell == 'true'
        run: bash scripts/lint-shell.sh

      - name: Check workflows and inline shell
        if: needs.changes.outputs.workflows == 'true'
        run: sh scripts/lint-workflows.sh
