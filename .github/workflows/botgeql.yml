  latex:
    name: LaTeX specification
    needs: [changes, reuse]
    if: always() && !cancelled() && needs.changes.outputs.latex == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',latex,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Checkout repository
        if: ${{ !contains(needs.reuse.outputs.checks, ',latex,') }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install TeX Live packages
        if: ${{ !contains(needs.reuse.outputs.checks, ',latex,') }}
        run: |
          sudo apt-get -o Acquire::Retries=2 update --error-on=any
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            chktex lacheck latexmk lmodern texlive-latex-extra texlive-latex-recommended
          for package in aliascnt cleveref darkmode nag; do
            kpsewhich "$package.sty" > /dev/null || {
              printf 'TeX Live lacks %s.sty\n' "$package" >&2
              exit 1
            }
          done

      # The build output is discarded: TeX Live versions differ, so the committed PDF is not compared.
      - name: Lint and build the specification
        if: ${{ !contains(needs.reuse.outputs.checks, ',latex,') }}
        run: sh scripts/quality/check-latex.sh

  botgeql:
    name: BotgeQL
    needs:
      [
        check-pr-target,
        changes,
        documentation-and-typescript,
        rust-static,
        rust-coverage,
        rust-miri,
        rust-dependencies,
        go-activity,
        ios,
        quantum-proofs,
        qsharp,
        chemistry-proofs,
        chemistry,
        latex,
        tooling-lint
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every BotgeQL stage to pass
        env:
          RESULTS: >-
            check-pr-target=${{ needs.check-pr-target.result }} changes=${{ needs.changes.result }}
            documentation-and-typescript=${{ needs.documentation-and-typescript.result }}
            rust-static=${{ needs.rust-static.result }} rust-coverage=${{ needs.rust-coverage.result
            }} rust-miri=${{ needs.rust-miri.result }} rust-dependencies=${{
            needs.rust-dependencies.result }} go-activity=${{ needs.go-activity.result }} ios=${{
            needs.ios.result }} quantum-proofs=${{ needs.quantum-proofs.result }} qsharp=${{
            needs.qsharp.result }} chemistry-proofs=${{ needs.chemistry-proofs.result }}
            chemistry=${{ needs.chemistry.result }} latex=${{ needs.latex.result }} tooling-lint=${{
            needs.tooling-lint.result }}
        run: |
          status=0
          for entry in $RESULTS; do
            case "${entry#*=}" in
              success | skipped) ;;
              *)
                printf '%s\n' "BotgeQL stage ${entry%%=*} ended as ${entry#*=}." >&2
                status=1
                ;;
            esac
          done
          # Change detection gates the other stages, so it must have run.
          case "$RESULTS" in
            *changes=success*) ;;
            *) status=1 ;;
          esac
          exit "$status"

  tooling-lint:
    name: Shell, Python, and workflow checks
    needs: [check-pr-target, changes, reuse]
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Require successful change detection
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_DETECTION_RESULT" = success

      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',tooling,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Checkout repository
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.shell ==
          'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.python ==
          'true' || needs.changes.outputs.ios == 'true') }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python tools
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.python ==
          'true' || needs.changes.outputs.ios == 'true') }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Check Swift documentation tags on Linux
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.ios ==
          'true') }}
        run: python scripts/ios/check_swift_docs.py

      - name: Set up locked Python package manager
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.python ==
          'true') }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Install pinned Python tools
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.python ==
          'true') }}
        run: uv sync --locked --no-python-downloads

      - name: Check Python helpers
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.python ==
          'true') }}
        run: .venv/bin/python scripts/quality/check_python.py

      - name: Install shell lint and test tools
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.shell ==
          'true' || needs.changes.outputs.workflows == 'true') }}
        env:
          NEED_SHELL_TESTS: ${{ needs.changes.outputs.shell }}
        run: |
          packages=()
          if ! command -v shellcheck > /dev/null 2>&1; then
            packages+=(shellcheck)
          fi
          if [ "$NEED_SHELL_TESTS" = 'true' ]; then
            packages+=(bats jq kcov)
          fi
          if ((${#packages[@]} > 0)); then
            sudo apt-get -o Acquire::Retries=2 update --error-on=any
            sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends "${packages[@]}"
          fi

      - name: Restore actionlint
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.workflows
          == 'true') }}
        uses: actions/cache@v6.1.0
        id: actionlint-cache
        with:
          path: ${{ runner.temp }}/botge-linters/actionlint
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-1.7.12

      - name: Install actionlint
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.workflows
          == 'true' && steps.actionlint-cache.outputs.cache-hit != 'true') }}
        run: |
          mkdir -p "$RUNNER_TEMP/botge-linters"
          GOBIN="$RUNNER_TEMP/botge-linters" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Add actionlint to PATH
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.workflows
          == 'true') }}
        run: printf '%s\n' "$RUNNER_TEMP/botge-linters" >> "$GITHUB_PATH"

      - name: Check shell scripts
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.shell ==
          'true') }}
        run: bash scripts/quality/lint-shell.sh

      - name: Test shell scripts and enforce coverage
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.shell ==
          'true') }}
        run: python3 scripts/quality/run_shell_tests.py

      - name: Check workflows and inline shell
        if:
          ${{ !contains(needs.reuse.outputs.checks, ',tooling,') && (needs.changes.outputs.workflows
          == 'true') }}
        run: python3 scripts/quality/lint_workflows.py

      - name: Record completed tooling checks
        if: ${{ !contains(needs.reuse.outputs.checks, ',tooling,') }}
