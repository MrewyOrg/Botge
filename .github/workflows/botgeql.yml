# cspell:words botgeql GOBIN rhysd VITE

name: BotgeQL

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check-pr-target:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/check-pr-target.yml
    permissions: {}

  botgeql:
    name: BotgeQL
    needs: check-pr-target
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and documentation
        run: |
          npx prettier . --check
          npm run markdownlint
          npm run cspell

      - name: Check PR title and commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_TITLE" | npx commitlint
          npx commitlint --from="$BASE_SHA" --to="$HEAD_SHA" --verbose

      - name: Types, lint, and unused code
        run: npm run check:static

      - name: Validate Activity HTML and SCSS
        env:
          VITE_ENABLE_7TV_DISCOVERY: 'true'
          VITE_ENABLE_ACTIVITY_ADDS: 'true'
          VITE_ENABLE_ACTIVITY_CATALOG: 'true'
        run: npm run check:markup -w activity

      - name: Tests and coverage
        run: |
          cp botge.example.config.jsonc botge.config.json
          npm run test:coverage

  tooling-lint:
    name: Shell and workflow lint
    needs: check-pr-target
    if: >-
      always() && !cancelled() && (needs.check-pr-target.result == 'success' ||
      needs.check-pr-target.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install ShellCheck and actionlint
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          mkdir -p "$RUNNER_TEMP/botge-linters"
          GOBIN="$RUNNER_TEMP/botge-linters" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/botge-linters" >> "$GITHUB_PATH"

      - name: Check shell scripts
        run: npm run lint:shell

      - name: Check workflows and inline shell
        run: npm run lint:workflows
