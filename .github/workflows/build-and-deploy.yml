# cspell:words cves

name: Build and Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate
    uses: $/.github/workflows/botgeql.yml
    permissions:
      contents: read
      pull-requests: read

  filter-paths:
    name: Filter deployment paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Filter paths
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            build:
              - '.github/workflows/build-and-deploy.yml'
              - '.dockerignore'
              - 'crates/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'Dockerfile'
              - 'Dockerfile.rego'
              - 'LICENSE.txt'
              - 'rust-toolchain.toml'
            # The Activity Worker serves the built page, so page and Worker inputs both count.
            activity:
              - '.github/workflows/build-and-deploy.yml'
              - '.nvmrc'
              - 'activity/deploy/**'
              - 'activity/index.html'
              - 'activity/package.json'
              - 'activity/public/**'
              - 'activity/src/**'
              - 'activity/tsconfig*.json'
              - 'assets/**'
              - 'package-lock.json'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'activity/worker/**'
              - 'activity/wrangler.jsonc'
            demo:
              - '.github/workflows/build-and-deploy.yml'
              - '.nvmrc'
              - 'activity/deploy/**'
              - 'activity/index.html'
              - 'activity/package.json'
              - 'activity/public/**'
              - 'activity/src/**'
              - 'activity/tsconfig*.json'
              - 'assets/**'
              - 'package-lock.json'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'activity/.env.demo'
              - 'activity/scripts/**'
              - 'activity/wrangler.demo.jsonc'
    outputs:
      build: ${{ steps.changes.outputs.build }}
      activity: ${{ steps.changes.outputs.activity }}
      demo: ${{ steps.changes.outputs.demo }}

  security:
    name: Security
    uses: $/.github/workflows/dependency-security.yml
    permissions:
      contents: read

  build:
    name: Build candidate
    needs: [validate, security, filter-paths]
    if: needs.filter-paths.outputs.build == 'true' && !github.event.pull_request.draft
    uses: docker/github-builder/.github/workflows/build.yml@1037c7b9c980b1eb201d37bb9f1fa6caaa96af60
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      meta-images: mrewy/botge
      # The candidate tag identifies the tested PR merge commit. Approval controls promotion.
      meta-tags: type=raw,value=pr-${{ github.event.number }}-${{ github.sha }}
      meta-flavor: latest=false
      set-meta-annotations: true
      set-meta-labels: true
      cache: true
      cache-mode: max
      platforms: linux/amd64,linux/arm64
      sbom: true
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  scan:
    name: Scan candidate image (${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Scan the immutable candidate with Docker Scout
        uses: docker/scout-action@v1.29.0
        with:
          command: cves
          image: registry://mrewy/botge@${{ needs.build.outputs.digest }}
          platform: ${{ matrix.platform }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          only-severities: critical
          only-fixed: false
          exit-code: true
          write-comment: false

  deploy:
    name: Deploy
    needs: [validate, security, filter-paths, build, scan]
    if: >-
      always() && !cancelled() && !github.event.pull_request.draft && needs.validate.result ==
      'success' && needs.security.result == 'success' && needs.filter-paths.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.scan.result ==
      'success' || (needs.filter-paths.outputs.build != 'true' && needs.scan.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Serialize promotion and the remote update together. Never cancel an active deployment.
    concurrency:
      group: botge-production
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      # The PR may have changed while this job waited for production approval.
      - name: Reject stale pull requests and changed targets
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE: ${{ github.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            jq --exit-status --arg head "$EXPECTED_HEAD" --arg merge "$EXPECTED_MERGE" \
              --arg repo "$GITHUB_REPOSITORY" '
                .state == "open" and .base.ref == "main" and .head.ref == "dev" and
                .head.repo.full_name == $repo and .head.sha == $head and .merge_commit_sha == $merge
              ' > /dev/null

      - name: Record a change without a new image
        if: needs.filter-paths.outputs.build != 'true'
        run:
          echo 'No image-affecting changes; the existing production image is retained.' >>
          "$GITHUB_STEP_SUMMARY"

      - name: Checkout the tested candidate
        if:
          needs.filter-paths.outputs.build == 'true' || needs.filter-paths.outputs.activity ==
          'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        if: needs.filter-paths.outputs.build == 'true'
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCLOUD_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCLOUD_PROJECT_ID }}

      - name: Set up Google Cloud
        if: needs.filter-paths.outputs.build == 'true'
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Promote the approved candidate to latest
        if: needs.filter-paths.outputs.build == 'true'
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo 'The build did not return a valid image digest.' >&2
            exit 1
          }
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/docker-auth.XXXXXX")"
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
          docker buildx imagetools create --tag mrewy/botge:latest "mrewy/botge@$IMAGE_DIGEST"

      - name: Deploy Botge
        if: needs.filter-paths.outputs.build == 'true'
        env:
          GCLOUD_INSTANCE: ${{ secrets.GCLOUD_INSTANCE }}
          GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
          GCLOUD_ZONE: ${{ secrets.GCLOUD_ZONE }}
          BOTGE_CONTROL_SOCKET: ${{ secrets.BOTGE_CONTROL_SOCKET }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          gcloud compute ssh "$GCLOUD_INSTANCE" \
            --project="$GCLOUD_PROJECT_ID" \
            --zone="$GCLOUD_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="BOTGE_CONTROL_SOCKET=$(printf '%q' "$BOTGE_CONTROL_SOCKET") bash -s -- deploy $(printf '%q' "$IMAGE_DIGEST")" \
              < scripts/botge-control.sh
          printf 'Deployed candidate: mrewy/botge@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      # The bot goes first, so the Activity page never calls an API older than itself.
      - name: Record an unchanged Activity
        if: needs.filter-paths.outputs.activity != 'true'
        run:
          echo 'No Activity changes; the deployed Activity Worker is retained.' >>
          "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        if: needs.filter-paths.outputs.activity == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            activity/deploy/package-lock.json

      - name: Build the Activity
        if: needs.filter-paths.outputs.activity == 'true'
        # Vite reads these at build time; without them the page shows only the preview catalog.
        env:
          VITE_ENABLE_ACTIVITY_CATALOG: 'true'
          VITE_ENABLE_ACTIVITY_ADDS: 'true'
          VITE_ENABLE_ACTIVITY_SETTINGS: 'true'
          VITE_ENABLE_ACTIVITY_GAME: 'true'
          VITE_ENABLE_7TV_DISCOVERY: 'true'
        run: |
          npm ci --prefer-offline --no-audit
          npm run build -w activity

      - name: Deploy the Activity Worker
        if: needs.filter-paths.outputs.activity == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_ACTIVITY_PUBLIC_KEY: ${{ vars.DISCORD_ACTIVITY_PUBLIC_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          [[ "$DISCORD_ACTIVITY_PUBLIC_KEY" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo 'Set the DISCORD_ACTIVITY_PUBLIC_KEY variable on the production environment.' >&2
            exit 1
          }
          # Install scripts stay off: Wrangler bundles and uploads without them.
          npm ci --prefix activity/deploy --ignore-scripts --no-audit
          activity/deploy/node_modules/.bin/wrangler deploy --config activity/wrangler.jsonc \
            --var "DISCORD_ACTIVITY_PUBLIC_KEY:$DISCORD_ACTIVITY_PUBLIC_KEY"
          echo 'Deployed the Activity Worker.' >> "$GITHUB_STEP_SUMMARY"

  deploy-demo:
    name: Deploy demo
    # Only an approved, successful production deployment releases the demo, so one approval covers
    # both. It then runs for every ready PR, so its environment always records a deployment for the
    # merge rule; the upload happens only when demo inputs changed.
    needs: [filter-paths, deploy]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: activity-demo
    concurrency:
      group: botge-activity-demo
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject stale pull requests and changed targets
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE: ${{ github.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            jq --exit-status --arg head "$EXPECTED_HEAD" --arg merge "$EXPECTED_MERGE" \
              --arg repo "$GITHUB_REPOSITORY" '
                .state == "open" and .base.ref == "main" and .head.ref == "dev" and
                .head.repo.full_name == $repo and .head.sha == $head and .merge_commit_sha == $merge
              ' > /dev/null

      - name: Record an unchanged demo
        if: needs.filter-paths.outputs.demo != 'true'
        run: echo 'No demo changes; the deployed demo is retained.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the tested candidate
        if: needs.filter-paths.outputs.demo == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        if: needs.filter-paths.outputs.demo == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            activity/deploy/package-lock.json

      - name: Build the demo
        if: needs.filter-paths.outputs.demo == 'true'
        run: |
          npm ci --prefer-offline --no-audit
          npm run build:demo -w activity

      - name: Deploy the demo
        if: needs.filter-paths.outputs.demo == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --prefix activity/deploy --ignore-scripts --no-audit
          activity/deploy/node_modules/.bin/wrangler deploy --config activity/wrangler.demo.jsonc
          echo 'Deployed the demo.' >> "$GITHUB_STEP_SUMMARY"
