name: Regal Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-target:
    uses: $/.github/workflows/check-pr-target.yml

    permissions: {}

  regal-lint:
    name: Regal lint
    needs: check-pr-target
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Filter paths
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            regal:
              - '.github/workflows/regal-lint.yml'
              - '.regal/config.yaml'
              - '**/*.rego'

      - name: Set up Regal
        if: steps.changes.outputs['regal'] == 'true'
        uses: open-policy-agent/setup-regal@v2.0.0
        with:
          version: v0.43.0

      - name: Regal lint
        if: steps.changes.outputs['regal'] == 'true'
        run: regal lint . --format github
