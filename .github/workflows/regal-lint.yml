name: Regal Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-target:
    uses: $/.github/workflows/check-pr-target.yml

    permissions: {}

  reuse:
    needs: check-pr-target
    uses: $/.github/workflows/reuse-validation.yml
    permissions:
      actions: read
      contents: read
    with:
      common-paths: '^\.github/workflows/regal-lint\.yml$'
      checks: >-
        {"paths":{"regal":"^([.]regal/)|[.]rego$"},"checks":[
        {"id":"regal","inputs":"regal","job":"Regal lint","step":"Regal lint"}]}

  regal-lint:
    name: Regal lint
    needs: [check-pr-target, reuse]
    if: always() && !cancelled() && needs.check-pr-target.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',regal,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Checkout repository
        if: ${{ !contains(needs.reuse.outputs.checks, ',regal,') }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Filter paths
        if: ${{ !contains(needs.reuse.outputs.checks, ',regal,') }}
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            regal:
              - '.github/workflows/regal-lint.yml'
              - '.regal/config.yaml'
              - '**/*.rego'

      - name: Set up Regal
        if: steps.changes.outputs['regal'] == 'true'
        uses: open-policy-agent/setup-regal@v2.0.0
        with:
          version: v0.43.0

      - name: Regal lint
        if: steps.changes.outputs['regal'] == 'true'
        run: regal lint . --format github
