name: Clean closed PR caches

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    name: Remove closed PR caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - name: Delete caches scoped to the closed PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh cache delete --all --ref "refs/pull/$PR_NUMBER/merge" --succeed-on-no-caches
