# @format

name: Auto-assign
on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  auto-assign:
    name: Auto-assign
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Auto-assign
        uses: pozil/auto-assign-issue@v4.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: Mrewy
