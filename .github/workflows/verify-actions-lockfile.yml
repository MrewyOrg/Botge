name: Verify Actions Lockfile

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-target:
    uses: $/.github/workflows/check-pr-target.yml

    permissions: {}

  reuse:
    needs: check-pr-target
    uses: $/.github/workflows/reuse-validation.yml
    permissions:
      actions: read
      contents: read
    with:
      common-paths: '^\.github/workflows/verify-actions-lockfile\.yml$'
      checks: >-
        {"paths":{"lockfile":"^[.]github/(workflows/|actions/)"},"checks":[
        {"id":"lockfile","inputs":"lockfile","job":"Verify actions lockfile","step":"Verify"}]}

  verify-actions-lockfile:
    name: Verify actions lockfile
    needs: [check-pr-target, reuse]
    if: always() && !cancelled() && needs.check-pr-target.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Report reused validation
        if: contains(needs.reuse.outputs.checks, ',lockfile,')
        run: echo 'An earlier passing run verified the same inputs.'

      - name: Filter paths
        if: ${{ !contains(needs.reuse.outputs.checks, ',lockfile,') }}
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            actions:
              - '.github/workflows/actions.lock'
              - '.github/workflows/*.{yml,yaml}'
              - '.github/actions/**'

      - name: Checkout repository
        if: steps.changes.outputs.actions == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify
        if: steps.changes.outputs.actions == 'true'
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.1
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
