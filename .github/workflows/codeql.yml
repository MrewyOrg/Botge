# @format

name: CodeQL

on:
  schedule:
    - cron: '49 12 * * 1'
  push:
    branches:
      - main
  pull_request:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Filter paths
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            actions:
              - '.github/workflows/*.yml'
            typescript:
              - '**/*.ts'

      - name: Initialize CodeQL
        if: github.event_name == 'schedule' || steps.changes.outputs[matrix.language] == 'true'
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: >-
            ${{
              matrix.language == 'typescript'
              && './.github/codeql/queries/typescript-security-and-quality.qls'
              || 'security-and-quality'
            }}

      - name: CodeQL analysis
        if: github.event_name == 'schedule' || steps.changes.outputs[matrix.language] == 'true'
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: '/language:${{ matrix.language }}'
