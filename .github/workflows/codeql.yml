name: CodeQL

on:
  schedule:
    - cron: '49 12 * * 1'
  push:
    branches: [main]
  # PRs into dev are Dependabot updates; every change still reaches main through a PR.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-target:
    uses: $/.github/workflows/check-pr-target.yml
    if: github.event_name == 'pull_request'

    permissions: {}

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: check-pr-target
    if: |
      always() &&
      (
        needs.check-pr-target.result == 'success' ||
        needs.check-pr-target.result == 'skipped'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Rust's buildless extractor still compiles build scripts and procedural macros.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR:
        ${{ github.workspace }}/.github/codeql/database/rust-cargo-cache

    permissions:
      contents: read
      pull-requests: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: go
          - language: python
          - language: rust
          - language: typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for extraction
        if: matrix.language == 'python'
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up the pinned Go toolchain for extraction
        if: matrix.language == 'go'
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: activity/server/.go-version
          cache-dependency-path: activity/server/tools/go.sum

      - name: Set up Node for Go extraction
        if: matrix.language == 'go'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build and stage the production Activity for extraction
        if: matrix.language == 'go'
        run: |
          npm ci --prefer-offline --no-audit
          sh scripts/activity/stage-activity-server.sh

      - name: Restore Rust extractor dependencies
        if: matrix.language == 'rust'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .github/codeql/database/rust-cargo-cache
          key: >-
            codeql-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml')
            }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            codeql-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          source-root: ${{ matrix.language == 'go' && 'activity/server' || '.' }}
          config-file: .github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: Build the Go Activity server for extraction
        if: matrix.language == 'go'
        working-directory: activity/server
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: go build -a -mod=readonly -o "${RUNNER_TEMP}/" ./...

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
