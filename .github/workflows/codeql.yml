name: CodeQL

on:
  schedule:
    - cron: '49 12 * * 1'
  push:
    branches:
      - dev
      - main
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-target:
    uses: $/.github/workflows/check-pr-target.yml
    if: github.event_name == 'pull_request'

    permissions: {}

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: check-pr-target
    if: |
      always() &&
      (
        needs.check-pr-target.result == 'success' ||
        needs.check-pr-target.result == 'skipped'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Filter paths
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            actions:
              - '.github/workflows/**'
            typescript:
              - '**/*.ts'
              - '.github/codeql/**'
              - 'package*.json'
              - '**/tsconfig*.json'

      - name: Initialize CodeQL
        if:
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') ||
          steps.changes.outputs[matrix.language] == 'true'
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: >-
            ${{
              matrix.language == 'typescript'
              && './.github/codeql/queries/typescript-security-and-quality.qls'
              || 'security-and-quality'
            }}

      - name: CodeQL analysis
        if:
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') ||
          steps.changes.outputs[matrix.language] == 'true'
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: '/language:${{ matrix.language }}'
