name: CodeQL

on:
  schedule:
    - cron: '49 12 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-target:
    uses: $/.github/workflows/check-pr-target.yml
    if: github.event_name == 'pull_request'

    permissions: {}

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: check-pr-target
    if: |
      always() &&
      (
        needs.check-pr-target.result == 'success' ||
        needs.check-pr-target.result == 'skipped'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: rust
          - language: typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
