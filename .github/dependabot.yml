version: 2

registries:
  docker:
    type: docker-registry
    url: dhi.io
    username: ${{ secrets.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_PASSWORD }}

updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
    groups:
      github-actions:
        patterns:
          - '*'
    target-branch: dev

  - package-ecosystem: devcontainers
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
    groups:
      devcontainer-features:
        patterns:
          - '*'
    target-branch: dev

  - package-ecosystem: docker
    directories:
      - '/'
      - '/activity/server'
    # Registry publication dates are unavailable, so an age-based delay cannot be enforced.
    cooldown:
      exclude:
        - '*'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
    groups:
      docker-images:
        patterns:
          - '*'
    registries:
      - docker
    target-branch: dev

  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
    groups:
      cargo-dependencies:
        patterns:
          - '*'
    ignore:
      # Both reqwest versions still require tower-http 0.6, and a second version fails Clippy's
      # multiple-crate-versions lint. Remove this once reqwest depends on tower-http 0.7.
      - dependency-name: tower-http
        versions: ['>=0.7']
    target-branch: dev

  - package-ecosystem: gomod
    directories: ['/activity/server', '/activity/server/tools']
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
    groups:
      go-tool-dependencies:
        patterns:
          - '*'
    target-branch: dev

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
    groups:
      npm-dependencies:
        patterns:
          - '*'
    versioning-strategy: increase
    labels:
      - dependencies
    target-branch: dev
