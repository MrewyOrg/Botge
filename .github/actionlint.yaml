# Workflows use standard GitHub-hosted runners.
self-hosted-runner:
  # GitHub-hosted labels that the pinned actionlint does not list yet.
  labels: [xcode-27, ubuntu-26.04]
config-variables:
  - ACTIVITY_ARTIFACT_REGISTRY_IMAGE
  - ACTIVITY_CLOUD_RUN_SERVICE
  - ACTIVITY_GCLOUD_DEPLOY_SERVICE_ACCOUNT
  - ACTIVITY_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT
  - DISCORD_ACTIVITY_PUBLIC_KEY
