[project]
name = 'botge-tooling'
# Internal tooling metadata; independent of Botge releases.
version = '0.0.0'
requires-python = '==3.15.*'

[project.optional-dependencies]
quantum = ['qdk==1.34.0', 'fastapi==0.165.0', 'uvicorn==0.54.0', 'httpx==0.28.1']
chemistry = ['rdkit==2026.9.2', 'fastapi==0.165.0', 'uvicorn==0.54.0', 'httpx==0.28.1']

[dependency-groups]
# SymPy and Z3 back quantum/proofs/symbolic, and mpmath's interval arithmetic the .tex constant
# checks, and NumPy the state-vector algebra in quantum/tests/test_circuit.py; the sidecar image
# installs without the dev group.
dev = [
  'ruff==0.17.6',
  'pyright==1.1.414',
  'coverage==7.17.5',
  'pytest==9.2.0',
  'mpmath==1.3.0',
  'numpy==2.5.5',
  'sympy==1.14.0',
  'z3-solver==5.4.1.0',
]

[tool.ruff]
target-version = 'py315'
line-length = 100
required-version = '==0.17.6'
extend-exclude = ['.agents/references/cache', 'target']

[tool.ruff.lint]
select = ['ALL']
# Conflicting docstring styles, formatter-owned syntax, CLI output, standalone scripts.
# Per-file copyright headers are not the repository's convention.
ignore = ['D203', 'D213', 'COM812', 'ISC001', 'T201', 'INP001', 'CPY001']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.per-file-ignores]
# These tests intentionally use stdlib unittest assertions. Runtime assert bans stay active.
'**/test_*.py' = ['PT009', 'PT027']

[tool.ruff.format]
quote-style = 'single'

[tool.pyright]
include = [
  'scripts',
  'tests/python',
  '.agents/scripts',
  '.agents/tests',
  'quantum/proofs/symbolic',
  'chemistry/proofs/symbolic',
]
exclude = ['.venv', '.agents/references/cache']
pythonVersion = '3.15'
typeCheckingMode = 'strict'
reportImplicitOverride = 'error'
reportUnnecessaryTypeIgnoreComment = 'error'
extraPaths = [
  'scripts/ios',
  'scripts/operations',
  'scripts/quality',
  'scripts/quantum',
  'scripts/chemistry',
  'quantum/proofs/symbolic',
  'chemistry/proofs/symbolic',
  'scripts/setup',
  '.agents/scripts',
  'tests/python'
]
venvPath = '.'
venv = '.venv'

[tool.uv]
package = false
required-version = '==0.13.9'
