rules:
  idiomatic:
    directory-package-mismatch:
      level: error
      ignore:
        # Buildx requires the policy beside Dockerfile, despite its docker package.
        files:
          - Dockerfile.rego
  style:
    line-length:
      max-line-length: 100
  custom:
    disallow-rego-v1:
      level: error
    missing-metadata:
      level: error
    one-liner-rule:
      level: error
