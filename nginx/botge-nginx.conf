# cspell:words healthz

proxy_cache_path /var/www/cache levels=1:2 keys_zone=botge-cache:8m max_size=5000m inactive=6000m;
proxy_temp_path /var/www/cache/tmp;

server {
  listen 80;
  listen [::]:80;

  proxy_cache botge-cache;
  proxy_cache_valid 200 302 6000m;
  proxy_cache_valid 404 1m;
  proxy_cache_lock on;
  proxy_cache_revalidate on;
  proxy_cache_background_update on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_ssl_verify_depth 3;

  location = /healthz {
    access_log off;
    return 200;
  }

  location /7tv/ {
    proxy_pass https://cdn.7tv.app/;
  }

  location /bttv/ {
    proxy_pass https://cdn.betterttv.net/;
  }

  location /ffz/ {
    proxy_pass https://cdn.frankerfacez.com/;
  }

  location /twitch/ {
    proxy_pass https://static-cdn.jtvnw.net/;
  }
}
