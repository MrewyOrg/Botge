[workspace]
members = ['crates/*']
default-members = ['crates/botge']
resolver = '3'

[workspace.package]
version = '5.4.1'
edition = '2024'
# Stable release that builds the production image; checks keep the pinned nightly.
rust-version = '1.99.1'
license = 'MIT'
repository = 'https://github.com/MrewyOrg/Botge'
publish = false

[workspace.dependencies]
anyhow = '1'
axum = '0.8'
base64 = '0.23'
botge-activity = { path = 'crates/botge-activity', version = '5.4.1' }
botge-app = { path = 'crates/botge-app', version = '5.4.1' }
botge-discord = { path = 'crates/botge-discord', version = '5.4.1' }
botge-domain = { path = 'crates/botge-domain', version = '5.4.1' }
botge-emotes = { path = 'crates/botge-emotes', version = '5.4.1' }
botge-storage = { path = 'crates/botge-storage', version = '5.4.1' }
botge-test-support = { path = 'crates/botge-test-support', version = '5.4.1' }
botge-voice = { path = 'crates/botge-voice', version = '5.4.1' }
ed25519-dalek = '3'
futures-util = '0.3'
hex = '0.4'
jsonc-parser = { version = '0.34', features = ['serde'] }
log = '0.4'
mimalloc = '0.1.52'
redb = '4.5'
reqwest = { version = '0.13', default-features = false, features = [
  'json',
  'rustls',
  'form',
] }
rustls = { version = '0.23', default-features = false, features = ['aws-lc-rs'] }
serde = { version = '1', features = ['derive'] }
serde_json = '1'
serenity = { version = '0.12', default-features = false, features = [
  'client',
  'gateway',
  'model',
  'rustls_backend',
  'voice',
] }
songbird = '0.6.1'
tempfile = '3'
tokio = { version = '1', features = [
  'fs',
  'io-util',
  'macros',
  'net',
  'process',
  'rt-multi-thread',
  'signal',
  'sync',
  'time',
] }
tokio-tungstenite = { version = '0.30', features = ['rustls-tls-webpki-roots'] }
tower-http = { version = '0.7', default-features = false, features = ['compression-gzip'] }
tracing = '0.1'
tracing-subscriber = { version = '0.3', features = ['env-filter'] }

url = { version = '2', features = ['serde'] }

[workspace.lints.rust]
# Treat warnings as errors in local builds, tests, and Clippy.
warnings = { level = 'deny', priority = -1 }

# Keep Botge's own code safe and require callers to handle fallible results.
unsafe_code = 'forbid'
unsafe_op_in_unsafe_fn = 'deny'
unused_must_use = 'deny'

# Make lifetimes and the crate's public surface explicit.
elided_lifetimes_in_paths = 'deny'
missing_debug_implementations = 'deny'
missing_docs = 'deny'
redundant_imports = 'deny'
redundant_lifetimes = 'deny'
single_use_lifetimes = 'deny'
unnameable_types = 'deny'
unreachable_pub = 'deny'
unused_import_braces = 'deny'
unused_lifetimes = 'deny'
unused_mut = 'deny'
unused_qualifications = 'deny'

# Make intentional disposal explicit, especially for guards and fallible operations.
ambiguous_negative_literals = 'deny'
let_underscore_drop = 'deny'
trivial_casts = 'deny'
trivial_numeric_casts = 'deny'

[workspace.lints.clippy]
# Keep the standard lint groups strict, then opt into focused additional checks below.
all = { level = 'deny', priority = -1 }
cargo = { level = 'deny', priority = -1 }
nursery = { level = 'deny', priority = -1 }
pedantic = { level = 'deny', priority = -1 }

# Explicit crate visibility documents service boundaries in this binary crate.
redundant_pub_crate = 'allow'

# Select compatible restriction lints rather than enabling the conflicting group.
as_pointer_underscore = 'deny'
as_underscore = 'deny'
clone_on_ref_ptr = 'deny'
cognitive_complexity = 'deny'
create_dir = 'deny'
deprecated_attributes_without_note = 'deny'
deref_by_slicing = 'deny'
disallowed_script_idents = 'deny'
empty_drop = 'deny'
empty_enum_variants_with_brackets = 'deny'
empty_structs_with_brackets = 'deny'
exit = 'deny'
filetype_is_file = 'deny'
fn_to_numeric_cast_any = 'deny'
get_unwrap = 'deny'
if_then_some_else_none = 'deny'
infinite_loop = 'deny'
let_underscore_future = 'deny'
let_underscore_must_use = 'deny'
lossy_float_literal = 'deny'
map_err_ignore = 'deny'
mixed_read_write_in_expression = 'deny'
mutex_atomic = 'deny'
mutex_integer = 'deny'
path_buf_push_overwrite = 'deny'
rc_buffer = 'deny'
rc_mutex = 'deny'
rest_pat_in_fully_bound_structs = 'deny'
string_slice = 'deny'
suspicious_xor_used_as_pow = 'deny'
try_err = 'deny'
unneeded_field_pattern = 'deny'
verbose_file_reads = 'deny'

# Document fallible and panicking APIs and keep documentation markup valid.
doc_markdown = 'deny'
missing_errors_doc = 'deny'
missing_panics_doc = 'deny'
missing_safety_doc = 'deny'
undocumented_unsafe_blocks = 'deny'
unnecessary_safety_comment = 'deny'
unnecessary_safety_doc = 'deny'

# Release synchronous locks and borrows before suspending an async task.
await_holding_invalid_type = 'deny'
await_holding_lock = 'deny'
await_holding_refcell_ref = 'deny'
disallowed_methods = 'deny'

# Require exclusive borrows only for operations that need them.
needless_pass_by_ref_mut = 'deny'
too_many_arguments = 'deny'

# Keep large buffers off worker stacks and make formatting captures explicit.
large_const_arrays = 'deny'
large_include_file = 'deny'
large_stack_arrays = 'deny'
uninlined_format_args = 'deny'

# Make numeric narrowing, signedness, and precision changes explicit and reviewable.
cast_lossless = 'deny'
cast_possible_truncation = 'deny'
cast_possible_wrap = 'deny'
cast_precision_loss = 'deny'
cast_sign_loss = 'deny'
checked_conversions = 'deny'
float_cmp = 'deny'
non_zero_suggestions = 'deny'
precedence_bits = 'deny'

# Infallible conversion traits and clock arithmetic must not hide failure paths.
fallible_impl_from = 'deny'
unchecked_time_subtraction = 'deny'

# Avoid hidden cloning and unnecessary conversion allocations.
implicit_clone = 'deny'
inefficient_to_string = 'deny'
map_with_unused_argument_over_ranges = 'deny'
pathbuf_init_then_push = 'deny'

# Keep syntax, imports, and documentation consistent without changing API contracts.
doc_paragraphs_missing_punctuation = 'deny'
needless_raw_strings = 'deny'
redundant_type_annotations = 'deny'
ref_patterns = 'deny'
renamed_function_params = 'deny'
# The baseline's outside-block style conflicts with this pedantic inside-block rule.
semicolon_if_nothing_returned = 'allow'
semicolon_outside_block = 'deny'
unnecessary_self_imports = 'deny'
unused_trait_names = 'deny'

# Propagate errors and handle bounds explicitly.
assertions_on_result_states = 'deny'
expect_used = 'deny'
indexing_slicing = 'deny'
panic = 'deny'
unreachable = 'deny'
unused_result_ok = 'deny'
unwrap_used = 'deny'

# Keep unfinished paths and debugging calls out of committed code.
dbg_macro = 'deny'
todo = 'deny'
unimplemented = 'deny'

# Preserve resource cleanup and document local lint exceptions.
allow_attributes = 'deny'
allow_attributes_without_reason = 'deny'
mem_forget = 'deny'

[workspace.lints.rustdoc]
# Validate links, markup, code blocks, and crate documentation, including private-item docs.
all = { level = 'deny', priority = -1 }

# Keep local build artifacts small. Release builds use Cargo's defaults.

[profile.dev]
debug = 0

[profile.test]
debug = 0

# Profile Botge's hot paths without rebuilding all dependencies with debug symbols.

[profile.bench.package.botge]
debug = 1
