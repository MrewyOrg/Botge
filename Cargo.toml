# cspell:words dalek rustls serde uninlined webpki

[package]
name = 'botge'
version = '5.3.0'
edition = '2024'
description = 'Discord bot for emotes, overlays, and the Botge Activity'
license = 'MIT'
repository = 'https://github.com/MrewyOrg/Botge'
publish = false

[dependencies]
anyhow = '1'
axum = '0.8'
base64 = '0.23'
ed25519-dalek = '3'
futures-util = '0.3'
hex = '0.4'
jsonc-parser = { version = '0.34', features = ['serde'] }
redb = '4.5'
reqwest = { version = '0.13', default-features = false, features = [
  'json',
  'rustls',
  'form',
] }
rustls = { version = '0.23', default-features = false, features = ['aws-lc-rs'] }
serde = { version = '1', features = ['derive'] }
serde_json = '1'
serenity = { version = '0.12', default-features = false, features = [
  'client',
  'gateway',
  'model',
  'rustls_backend',
  'voice',
] }
songbird = '0.6.1'
tempfile = '3'
tokio = { version = '1', features = [
  'fs',
  'io-util',
  'macros',
  'net',
  'process',
  'rt-multi-thread',
  'signal',
  'sync',
  'time',
] }
tokio-tungstenite = { version = '0.30', features = ['rustls-tls-webpki-roots'] }
tracing = '0.1'
tracing-subscriber = { version = '0.3', features = ['env-filter'] }

[dev-dependencies]
tokio = { version = '1', features = ['test-util'] }
tower = { version = '0.5', features = ['util'] }

[lints.rust]
# Treat warnings as errors in local builds, tests, and Clippy.
warnings = { level = 'deny', priority = -1 }

# Keep Botge's own code safe and require callers to handle fallible results.
unsafe_code = 'forbid'
unused_must_use = 'deny'

# Make lifetimes and the crate's public surface explicit.
elided_lifetimes_in_paths = 'deny'
unreachable_pub = 'deny'
unused_lifetimes = 'deny'
unused_mut = 'deny'
missing_docs = 'deny'

[lints.rustdoc]
# Validate links, markup, code blocks, and crate documentation, including private-item docs.
all = { level = 'deny', priority = -1 }

[lints.clippy]
# Keep the standard lint groups strict, then opt into focused additional checks below.
all = { level = 'deny', priority = -1 }
pedantic = { level = 'deny', priority = -1 }
nursery = { level = 'deny', priority = -1 }

# Explicit crate visibility documents service boundaries in this binary crate.
redundant_pub_crate = 'allow'

# Select compatible restriction lints rather than enabling the conflicting group.
clone_on_ref_ptr = 'deny'
create_dir = 'deny'
empty_drop = 'deny'
exit = 'deny'
filetype_is_file = 'deny'
fn_to_numeric_cast_any = 'deny'
get_unwrap = 'deny'
infinite_loop = 'deny'
let_underscore_future = 'deny'
let_underscore_must_use = 'deny'
lossy_float_literal = 'deny'
map_err_ignore = 'deny'
mixed_read_write_in_expression = 'deny'
mutex_atomic = 'deny'
mutex_integer = 'deny'
path_buf_push_overwrite = 'deny'
rc_buffer = 'deny'
rc_mutex = 'deny'
rest_pat_in_fully_bound_structs = 'deny'
string_slice = 'deny'
suspicious_xor_used_as_pow = 'deny'
try_err = 'deny'
unneeded_field_pattern = 'deny'
verbose_file_reads = 'deny'

# Document fallible and panicking APIs and keep documentation markup valid.
doc_markdown = 'deny'
missing_errors_doc = 'deny'
missing_panics_doc = 'deny'
missing_safety_doc = 'deny'
unnecessary_safety_doc = 'deny'

# Release synchronous locks and borrows before suspending an async task.
await_holding_lock = 'deny'
await_holding_refcell_ref = 'deny'
await_holding_invalid_type = 'deny'
disallowed_methods = 'deny'

# Require exclusive borrows only for operations that need them.
needless_pass_by_ref_mut = 'deny'
too_many_arguments = 'deny'

# Keep large buffers off worker stacks and make formatting captures explicit.
large_stack_arrays = 'deny'
large_const_arrays = 'deny'
uninlined_format_args = 'deny'

# Make numeric narrowing, signedness, and precision changes explicit and reviewable.
checked_conversions = 'deny'
cast_lossless = 'deny'
cast_possible_truncation = 'deny'
cast_possible_wrap = 'deny'
cast_precision_loss = 'deny'
cast_sign_loss = 'deny'
float_cmp = 'deny'

# Infallible conversion traits and clock arithmetic must not hide failure paths.
fallible_impl_from = 'deny'
unchecked_time_subtraction = 'deny'

# Avoid hidden cloning and unnecessary conversion allocations.
implicit_clone = 'deny'
inefficient_to_string = 'deny'

# Propagate errors and handle bounds explicitly.
expect_used = 'deny'
indexing_slicing = 'deny'
panic = 'deny'
unwrap_used = 'deny'

# Keep unfinished paths and debugging calls out of committed code.
dbg_macro = 'deny'
todo = 'deny'
unimplemented = 'deny'

# Preserve resource cleanup and document local lint exceptions.
mem_forget = 'deny'
allow_attributes_without_reason = 'deny'

# Keep local build artifacts small. Release builds use Cargo's defaults.
[profile.dev]
debug = 0

[profile.test]
debug = 0
