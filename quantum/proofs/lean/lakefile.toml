# Strict Lake configuration for Botge's quantum proofs; see .agents/references/lean/AUDIT.md.
name = 'botge_lean'
version = '0.1.0'
keywords = ['math', 'quantum']
defaultTargets = ['BotgeLean', 'audit_axioms']
lintDriver = 'batteries/runLinter'
lintDriverArgs = ['BotgeLean']

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true
maxSynthPendingDepth = 3
warningAsError = true
# The standard set enables the header linter; leanOptions also reach the language server, so the
# MIT line replaces Mathlib's Apache default in the editor as well as in builds.
weak.linter.mathlibStandardSet = true
weak.linter.style.header.license = 'Released under the MIT license as described in the file LICENSE.txt.'
weak.linter.style.longLine = true
weak.linter.style.longFile = 1500
weak.linter.style.nameCheck = true
weak.linter.unusedVariables = true
weak.linter.unusedTactic = true
weak.linter.dupNamespace = true
weak.linter.unreachableTactic = false
weak.linter.unnecessarySeqFocus = false

[[require]]
name = 'mathlib'
scope = 'leanprover-community'
rev = 'v4.36.0'

[[lean_lib]]
name = 'BotgeLean'

[[lean_exe]]
name = 'audit_axioms'
root = 'BotgeLean.AuditAxioms'
supportInterpreter = true
