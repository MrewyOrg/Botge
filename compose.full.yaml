# cspell:words noexec nosuid tmpfs

name: Botge

services:
  nginx:
    image: nginx:mainline-alpine
    mem_limit: 256m
    restart: unless-stopped
    logging: &logging
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./nginx/cache:/var/www/cache:rw
      - ./nginx/botge-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  meilisearch:
    image: getmeili/meilisearch:latest
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7700/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - meilisearch-data:/meili_data
    env_file:
      - .env
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_UPGRADE_DB=true
      - MEILI_EXPERIMENTAL_REDUCE_INDEXING_MEMORY_USAGE

  chromadb:
    image: chromadb/chroma:latest
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # The current image has Bash but no curl or wget.
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost:
          localhost\r\nConnection: close\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - chromadb-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  botge:
    depends_on:
      nginx:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    image: mrewy/botge
    mem_limit: 512m
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
    logging: *logging
    volumes:
      - botge-data:/app/data
      - ./botge.config.json:/app/botge.config.json:ro
    env_file:
      - .env
    environment:
      # Node
      - NODE_ENV=production

      # MeiliSearch
      - MEILISEARCH_HOST=http://meilisearch:7700

      # NGINX
      - LOCAL_CACHE_BASE=http://nginx:80

volumes:
  botge-data:
  meilisearch-data:
  chromadb-data:
