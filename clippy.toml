# cspell:words dalek gnullvm msvc rustls syscall uninlined webpki

# Internal APIs are documented too; Botge is a binary crate with crate-visible services.
check-private-items = true

# This binary has no downstream Rust API whose compatibility should suppress useful lints.
avoid-breaking-exported-api = false

# Panic-prone shortcuts remain forbidden in constant evaluation too.
allow-expect-in-consts = false
allow-unwrap-in-consts = false

# Capture named format arguments even when another argument needs an expression.
allow-mixed-uninlined-format-args = false

# Keep branching and service interfaces bounded; buffer size is in bytes.
cognitive-complexity-threshold = 25
too-many-arguments-threshold = 6
array-size-threshold = 8192

# Database transactions must finish in synchronous storage work before awaiting anything.
await-holding-invalid-types = ['redb::ReadTransaction', 'redb::WriteTransaction']

# Current SDK, crypto, and platform dependencies require incompatible release lines.
# Review these exceptions with `cargo tree --locked --duplicates --target all` on lockfile updates.
# Keep the Cargo group's duplicate-version check active for names outside this list.
allowed-duplicate-crates = [
  'base64',
  'bitflags',
  'block-buffer',
  'chacha20',
  'const-oid',
  'cpufeatures',
  'crypto-common',
  'curve25519-dalek',
  'digest',
  'ed25519',
  'ed25519-dalek',
  'fiat-crypto',
  'getrandom',
  'parking_lot',
  'parking_lot_core',
  'r-efi',
  'rand',
  'rand_chacha',
  'rand_core',
  'redox_syscall',
  'reqwest',
  'rustls',
  'rustls-webpki',
  'sha1',
  'sha2',
  'signature',
  'socket2',
  'syn',
  'thiserror',
  'thiserror-impl',
  'tokio-rustls',
  'tokio-tungstenite',
  'tokio-websockets',
  'tungstenite',
  'webpki-roots',
  'windows-sys',
  'windows-targets',
  'windows_aarch64_gnullvm',
  'windows_aarch64_msvc',
  'windows_i686_gnu',
  'windows_i686_msvc',
  'windows_x86_64_gnu',
  'windows_x86_64_gnullvm',
  'windows_x86_64_msvc',
]

# These APIs can block Tokio worker threads; use asynchronous waits or the blocking pool.
disallowed-methods = [
  { path = 'std::thread::sleep', reason = 'Use an asynchronous timer instead of blocking a worker thread', replacement = 'tokio::time::sleep' },
  { path = 'tokio::task::block_in_place', reason = 'Run blocking storage work on the blocking pool', replacement = 'tokio::task::spawn_blocking' },
]
