# cspell:words noexec nosuid tmpfs

name: Botge

services:
  nginx:
    image: nginx:mainline-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    mem_limit: 128m
    restart: unless-stopped
    logging: &logging
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./nginx/cache:/var/www/cache:rw
      - ./nginx/botge-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  botge:
    depends_on:
      nginx:
        condition: service_healthy
    image: ${BOTGE_IMAGE:-mrewy/botge}
    mem_limit: 512m
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', '/app/botge', '--healthcheck']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    read_only: true
    # FFmpeg inputs and outputs are temporary. redb data lives in the persistent volume below.
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
    logging: *logging
    volumes:
      - botge-data:/app/data
      - ./botge.config.json:/app/botge.config.json:ro
    env_file:
      - .env
    environment:
      # Route supported provider media through the internal nginx cache.
      - LOCAL_CACHE_BASE=http://nginx:80

volumes:
  botge-data:
