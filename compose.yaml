# @format
name: Botge

services:
  nginx:
    image: nginx:mainline-alpine
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - ./nginx/cache:/var/www/cache:rw
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  meilisearch:
    image: getmeili/meilisearch:latest
    mem_limit: 512m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_EXPERIMENTAL_REDUCE_INDEXING_MEMORY_USAGE
      - MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE

  chromadb:
    image: chromadb/chroma:latest
    mem_limit: 1g
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  botge:
    depends_on:
      - nginx
      - meilisearch
      - chromadb
    # Uncomment image, comment build and context for non-local compose.
    # image: mrewy/botge
    build:
      context: .
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./botge.config.json:/app/botge.config.json
    env_file:
      - .env
    environment:
      # Node
      - NODE_ENV=production

      # MeiliSearch
      - MEILISEARCH_HOST=http://meilisearch:7700

      # NGINX
      - LOCAL_CACHE_BASE=http://nginx:80
